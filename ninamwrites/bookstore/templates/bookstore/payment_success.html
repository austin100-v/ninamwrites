{% extends 'bookstore/base.html' %}
{% block content %}
<div class="success-container" style="text-align: center; padding: 3rem;">
    <i class="fas fa-check-circle" style="font-size: 5rem; color: #28a745;"></i>
    <h1>Payment Successful!</h1>
    <p>Thank you for your purchase.</p>
    <p>Order ID: {{ payment_id }}</p>
    <p>Amount: ${{ amount }}</p>
    <a href="{% url 'bookstore:index' %}" class="btn-primary">Continue Shopping</a>
</div>
{% endblock %}
